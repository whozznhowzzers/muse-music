1name: Render Music Video
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Render video
        run: npx --yes hyperframes@0.8.145 render . --skill=music-to-video -q draft -o video.mp4 --fps 30 --workers 1

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: music-video
          path: video.mp4
          retention-days: 7
