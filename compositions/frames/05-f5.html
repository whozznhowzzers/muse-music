<template>
  
  <style>
    #stage {
      container-type: size;
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #1a1a18;
      font-family: "Barlow", sans-serif;
    }
    #g1 {
      position: absolute;
      inset: 0;
    }
    #g1-canvas {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      display: block;
    }
    #g1-fallback {
      position: absolute;
      inset: 0;
      display: none;
      background:
        radial-gradient(ellipse 70% 45% at 50% 46%, rgba(232, 93, 38, 0.22) 0%, rgba(232, 93, 38, 0.05) 55%, rgba(26, 26, 24, 0) 75%),
        #1a1a18;
    }
    .g1-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3.5cqw;
      text-align: center;
      pointer-events: none;
    }
    #g1-mark {
      display: flex;
      font-size: 14cqw;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 0.9;
      text-transform: lowercase;
      opacity: 0;
      white-space: nowrap;
    }
    .g1-letter {
      display: inline-block;
      background: linear-gradient(180deg, #f0ece5 0%, #e85d26 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #g1-rule {
      width: 0;
      height: 2px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(240, 236, 229, 0.9) 50%,
        transparent 100%
      );
      opacity: 0;
    }
  </style>
  <div
    id="stage"
    class="clip"
    data-composition-id="05-f5"
    data-width="1080"
    data-height="1920"
    data-start="0"
    data-duration="15"
  >
    <div id="g1" class="clip">
      <div id="g1_inner">
        <canvas id="g1-canvas" width="1080" height="1920"></canvas>
        <div id="g1-fallback"></div>
        <div class="g1-overlay">
          <div id="g1-mark"><!-- letters injected from markText --></div>
          <div id="g1-rule"></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var STAGE_ID = "05-f5";
      var W = 1080;
      var H = 1920;

      // ── frame-local params (from storyboard g1) ─────────────────────────
      var PARAMS = {
        bgColor: "#1A1A18",
        colorLow: "#1A1A18",
        colorMid: "#E85D26",
        colorHigh: "#F0ECE5",
        accentColor: "#E85D26",
        markText: "still here",
        flowSpeed: 0.5, // "slow"
      };

      function hexToLinear(hex) {
        var h = String(hex).replace("#", "").trim();
        if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
        var f = function (s) {
          return Math.pow(parseInt(s, 16) / 255, 2.2);
        };
        return [f(h.substr(0, 2)), f(h.substr(2, 2)), f(h.substr(4, 2))];
      }

      var canvas = document.getElementById("g1-canvas");
      var gl = canvas.getContext("webgl", {
        antialias: false,
        alpha: false,
        preserveDrawingBuffer: true,
      });
      if (!gl) {
        canvas.style.display = "none";
        document.getElementById("g1-fallback").style.display = "block";
      }

      // ── shader state: everything visible comes from these, driven by gsap
      var S = {
        uTime: 0,
        uPhase: 0,
        uReveal: 0,
        uChromAb: 0,
        uVignette: 0,
        uIntensity: 0.22,
      };

      var loc = {};
      if (gl) {
        var vert = [
          "attribute vec2 aPos;",
          "varying vec2 vUv;",
          "void main(){",
          "  vUv = aPos * 0.5 + 0.5;",
          "  gl_Position = vec4(aPos, 0.0, 1.0);",
          "}",
        ].join("\n");

        var frag = [
          "precision highp float;",
          "varying vec2 vUv;",
          "uniform float uTime;",
          "uniform float uPhase;",
          "uniform float uReveal;",
          "uniform float uChromAb;",
          "uniform float uVignette;",
          "uniform float uIntensity;",
          "uniform float uSpeed;",
          "uniform vec2  uResolution;",
          "uniform vec3  uColLow;",
          "uniform vec3  uColMid;",
          "uniform vec3  uColHigh;",
          "uniform vec3  uAccent;",

          "float hash21(vec2 p){",
          "  p = fract(p * vec2(123.34, 456.21));",
          "  p += dot(p, p + 45.32);",
          "  return fract(p.x * p.y);",
          "}",

          "float noise2(vec2 p){",
          "  vec2 i = floor(p);",
          "  vec2 f = fract(p);",
          "  vec2 u = f * f * (3.0 - 2.0 * f);",
          "  float a = hash21(i);",
          "  float b = hash21(i + vec2(1.0, 0.0));",
          "  float c = hash21(i + vec2(0.0, 1.0));",
          "  float d = hash21(i + vec2(1.0, 1.0));",
          "  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);",
          "}",

          "float fbm(vec2 p){",
          "  float v = 0.0;",
          "  float a = 0.5;",
          "  for(int i=0;i<5;i++){",
          "    v += a * noise2(p);",
          "    p *= 2.02;",
          "    a *= 0.5;",
          "  }",
          "  return v;",
          "}",

          "vec2 curl(vec2 p, float t){",
          "  float e = 0.6;",
          "  float n1 = fbm(p + vec2(0.0,  e) + t*0.18);",
          "  float n2 = fbm(p + vec2(0.0, -e) + t*0.18);",
          "  float n3 = fbm(p + vec2( e, 0.0) + t*0.18);",
          "  float n4 = fbm(p + vec2(-e, 0.0) + t*0.18);",
          "  return vec2(n1 - n2, -(n3 - n4));",
          "}",

          "vec3 palette(float t){",
          "  t = clamp(t, 0.0, 1.0);",
          "  vec3 lowMid = mix(uColLow, uColMid, smoothstep(0.0, 0.5, t));",
          "  return mix(lowMid, uColHigh, smoothstep(0.5, 1.0, t));",
          "}",

          "vec3 sampleField(vec2 uv, float t, float energy){",
          "  vec2 p = (uv - 0.5) * vec2(uResolution.x/uResolution.y, 1.0) * 2.4;",
          "  vec2 c = curl(p * 0.9, t);",
          "  vec2 q = p + c * (0.45 + 0.55 * energy);",
          "  float flow = fbm(q * 1.6 + vec2(t * 0.11, -t * 0.07));",
          "  float bands = sin(flow * 14.0 + t * 1.1);",
          "  bands = smoothstep(0.0, 1.0, 0.5 + 0.5 * bands);",
          "  float r = length(p);",
          "  float core = smoothstep(1.5, 0.05, r) * (0.6 + 0.4 * energy);",
          "  float glow = exp(-r * 1.6) * (0.55 + 0.45 * energy);",
          "  float k = clamp(flow * 0.85 + 0.15 * bands + 0.25 * core + 0.6 * glow, 0.0, 1.4);",
          "  vec3 col = palette(k * 0.9 + 0.1 * sin(t * 0.4));",
          "  col *= 0.7 + 0.6 * energy;",
          "  col += uAccent * core * 0.55;",
          "  return col;",
          "}",

          "void main(){",
          "  vec2 uv = vUv;",
          "  float t = uTime * uSpeed;",
          "  float e = uIntensity;",
          "  vec2 dir = normalize(uv - 0.5 + 1e-6);",
          "  float ca = uChromAb * (0.004 + 0.012 * length(uv - 0.5));",
          "  vec3 cR = sampleField(uv + dir * ca,        t, e);",
          "  vec3 cG = sampleField(uv,                   t, e);",
          "  vec3 cB = sampleField(uv - dir * ca,        t, e);",
          "  vec3 col = vec3(cR.r, cG.g, cB.b);",
          "  float lum = dot(col, vec3(0.299, 0.587, 0.114));",
          "  col = mix(vec3(lum), col, 1.05);",
          "  float rev = uReveal;",
          "  float sweep = smoothstep(0.0, 0.6, rev) * (1.0 - smoothstep(0.6, 1.0, rev));",
          "  col += uColHigh * sweep * 0.35;",
          "  vec3 phaseTint = mix(vec3(0.85, 0.92, 1.05), vec3(1.05, 0.95, 0.85), uPhase);",
          "  col *= phaseTint;",
          "  float v = length(uv - 0.5);",
          "  col *= 1.0 - smoothstep(0.45, 0.95, v) * uVignette;",
          "  col = col / (col + 1.0);",
          "  col = pow(col, vec3(1.0/2.2));",
          "  gl_FragColor = vec4(col, 1.0);",
          "}",
        ].join("\n");

        function compile(type, src) {
          var sh = gl.createShader(type);
          gl.shaderSource(sh, src);
          gl.compileShader(sh);
          return sh;
        }
        var prog = gl.createProgram();
        gl.attachShader(prog, compile(gl.VERTEX_SHADER, vert));
        gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, frag));
        gl.linkProgram(prog);
        gl.useProgram(prog);

        var buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array([-1, -1, 3, -1, -1, 3]),
          gl.STATIC_DRAW
        );
        var aPos = gl.getAttribLocation(prog, "aPos");
        gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

        var names = [
          "uTime", "uPhase", "uReveal", "uChromAb", "uVignette",
          "uIntensity", "uSpeed", "uResolution",
          "uColLow", "uColMid", "uColHigh", "uAccent",
        ];
        names.forEach(function (n) {
          loc[n] = gl.getUniformLocation(prog, n);
        });

        gl.uniform2f(loc.uResolution, W, H);
        gl.uniform1f(loc.uSpeed, PARAMS.flowSpeed);
        var g1_set3 = function (l, v) {
          gl.uniform3f(l, v[0], v[1], v[2]);
        };
        g1_set3(loc.uColLow, hexToLinear(PARAMS.colorLow));
        g1_set3(loc.uColMid, hexToLinear(PARAMS.colorMid));
        g1_set3(loc.uColHigh, hexToLinear(PARAMS.colorHigh));
        g1_set3(loc.uAccent, hexToLinear(PARAMS.accentColor));
        gl.viewport(0, 0, W, H);
      }

      function g1_applyFrame() {
        if (!gl) return;
        gl.uniform1f(loc.uTime, S.uTime);
        gl.uniform1f(loc.uPhase, S.uPhase);
        gl.uniform1f(loc.uReveal, S.uReveal);
        gl.uniform1f(loc.uChromAb, S.uChromAb);
        gl.uniform1f(loc.uVignette, S.uVignette);
        gl.uniform1f(loc.uIntensity, S.uIntensity);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }

      // ── hero text: "still here", letter spans for stagger ────────────────
      var mark = document.getElementById("g1-mark");
      mark.innerHTML = "";
      Array.prototype.forEach.call(PARAMS.markText, function (ch) {
        var span = document.createElement("span");
        span.className = "g1-letter";
        span.textContent = ch === " " ? " " : ch;
        mark.appendChild(span);
      });
      var letters = mark.querySelectorAll(".g1-letter");
      var rule = document.getElementById("g1-rule");

      // ── deterministic timeline (host global gsap) ───────────────────────
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true, onUpdate: g1_applyFrame });

      // group g1: visible across its whole frame-local span [0, 15)
      // (target the inner wrapper — #g1 itself is framework-managed)
      tl.set("#g1_inner", { autoAlpha: 1 }, 0);

      // ── living field: slow drift + gentle swells on the 119s / 125s fills
      tl.to(S, { uTime: 15, duration: 15, ease: "none" }, 0);

      tl.set(S, { uIntensity: 0.22 }, 0);
      tl.to(S, { uIntensity: 0.8, duration: 2.6, ease: "sine.inOut" }, 0.8); // swell into fill @ local 3
      tl.to(S, { uIntensity: 0.4, duration: 2.2, ease: "sine.inOut" }, 3.4);
      tl.to(S, { uIntensity: 0.65, duration: 2.2, ease: "sine.inOut" }, 7.2); // swell into fill @ local 9
      tl.to(S, { uIntensity: 0.38, duration: 2.0, ease: "sine.inOut" }, 9.4);
      tl.to(S, { uIntensity: 0.18, duration: 3.6, ease: "sine.inOut" }, 11.4); // drift out

      tl.to(S, { uChromAb: 0.3, duration: 4.0, ease: "sine.in" }, 0);
      tl.to(S, { uChromAb: 0.7, duration: 0.6, ease: "sine.out" }, 3.2);
      tl.to(S, { uChromAb: 0.25, duration: 1.5, ease: "power2.out" }, 3.8);
      tl.to(S, { uChromAb: 0.55, duration: 0.6, ease: "sine.out" }, 9.2);
      tl.to(S, { uChromAb: 0.18, duration: 3.5, ease: "sine.inOut" }, 9.8);

      tl.fromTo(S, { uReveal: 0 }, { uReveal: 1, duration: 1.2, ease: "none" }, 3.0);
      tl.set(S, { uReveal: 0 }, 4.4);

      tl.to(S, { uPhase: 0.5, duration: 15, ease: "sine.inOut" }, 0);
      tl.to(S, { uVignette: 0.75, duration: 5, ease: "power2.out" }, 4.0);

      // ── hero: "still here" rises blurred ahead of the first fill, then holds
      tl.fromTo(
        mark,
        {
          opacity: 0,
          scale: 1.12,
          filter: "blur(18px) drop-shadow(0 0 90px rgba(232,93,38,0.55))",
        },
        {
          opacity: 1,
          scale: 1,
          filter: "blur(0px) drop-shadow(0 0 60px rgba(232,93,38,0.45))",
          duration: 1.2,
          ease: "power3.out",
        },
        2.2
      );
      tl.fromTo(
        letters,
        { y: 70 },
        { y: 0, duration: 1.1, ease: "expo.out", stagger: 0.07 },
        2.2
      );
      tl.to(mark, { scale: 1.03, duration: 6, ease: "sine.inOut" }, 6.0); // slow breathing hold

      // ── hairline rule sweeps once the phrase lands
      tl.fromTo(
        rule,
        { width: 0, opacity: 0 },
        { width: 320, opacity: 0.85, duration: 0.9, ease: "power2.out" },
        5.6
      );

      // ── end: text dissolves back into the field before the hard cut
      tl.to([mark, rule], { opacity: 0, duration: 0.9, ease: "power1.in" }, 14.1);

      tl.seek(0);
      window.__timelines[STAGE_ID] = tl;

      // Repaints are driven by the timeline's onUpdate (seek-safe for capture);
      // one explicit paint covers the initial state before any seek.
      g1_applyFrame();
    })();
  </script>
</template>
